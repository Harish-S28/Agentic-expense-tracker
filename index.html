<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendLog AI — Agentic Expense Tracker</title>
    <meta name="description" content="Futuristic AI-powered FinTech expense tracker and financial intelligence dashboard." />
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Modules -->
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/transactions.css" />
    <link rel="stylesheet" href="/css/analytics.css" />
    <link rel="stylesheet" href="/css/budgets.css" />
    <link rel="stylesheet" href="/css/goals.css" />
    <link rel="stylesheet" href="/css/agent.css" />
    <link rel="stylesheet" href="/css/settings.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <!-- Auth Portal Container (when logged out or on #login) -->
    <div id="auth-shell-container" style="display:none;"></div>

    <!-- Main Dashboard Shell Container -->
    <div id="app-shell-container" class="app-container">
      <!-- Sidebar Navigation -->
      <aside id="app-sidebar" class="app-sidebar"></aside>

      <!-- Main Application Canvas -->
      <main class="app-main">
        <!-- Top Navbar -->
        <header id="app-topbar" class="app-topbar"></header>

        <!-- Dynamic Page View Container -->
        <div id="view-content" class="view-container"></div>
      </main>

      <!-- Mobile Bottom Navigation Bar -->
      <nav id="mobile-bottom-nav" class="mobile-bottom-nav"></nav>
    </div>

    <!-- Modal Backdrop -->
    <div id="modal-backdrop" class="modal-backdrop"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modular Vanilla JS Application -->
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
